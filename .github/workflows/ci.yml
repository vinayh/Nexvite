# Typecheck, test with coverage, and upload the report to Codecov.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # wrangler.jsonc and the generated types are gitignored (deployment ids);
      # the placeholder template is enough for typegen and the test env.
      - run: cp wrangler.example.jsonc wrangler.jsonc && npm run cf-typegen

      - run: npm run check

      - run: npm run test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: vinayh/Nexvite
          files: coverage/lcov.info
